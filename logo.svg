      id="toothGradient"
      x1="70"
      y1="120"
      x2="540"
      y2="610"
      gradientUnits="userSpaceOnUse"
    >

      <stop
        offset="0"
        stop-color="#11B8D0"
      />

      <stop
        offset=".52"
        stop-color="#079AC8"
      />

      <stop
        offset="1"
        stop-color="#0752B7"
      />

    </linearGradient>


    <linearGradient
      id="wordGradient"
      x1="390"
      y1="130"
      x2="900"
      y2="300"
      gradientUnits="userSpaceOnUse"
    >

      <stop
        offset="0"
        stop-color="#079FC8"
      />

      <stop
        offset="1"
        stop-color="#0752B7"
      />

    </linearGradient>

  </defs>


